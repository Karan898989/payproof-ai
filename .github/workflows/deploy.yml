name: Deploy PayProof AI to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}

        run: |
          mkdir -p ~/.ssh
          echo "$EC2_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts

          ssh -i ~/.ssh/deploy_key "$EC2_USER@$EC2_HOST" << 'EOF'
            set -e

            cd /home/ec2-user/payproof-ai

            echo "Pulling latest code..."
            git fetch origin main
            git reset --hard origin/main

            echo "Building Docker image..."
            sudo docker build -t payproof-ai .

            echo "Replacing old container..."
            sudo docker rm -f payproof-ai || true

            echo "Starting new container..."
            sudo docker run -d \
              --name payproof-ai \
              --restart unless-stopped \
              -p 127.0.0.1:8000:8000 \
              -v payproof-data:/app/.var \
              payproof-ai

            echo "Waiting for application..."
            sleep 10

            echo "Checking health..."
            curl --fail http://127.0.0.1:8000/health/live

            echo "DEPLOYMENT SUCCESSFUL"
          EOF
